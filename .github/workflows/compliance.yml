name: Compliance

on:
  pull_request:
    paths:
      - "**/*.c"
      - "**/*.h"

jobs:
  setup:
    runs-on: ubuntu-24.04
    # Skip job if it was triggered by Renovate Bot
    if: ${{ !contains(github.actor, 'renovate') }}
    outputs:
      toolchain-version: ${{ steps.setup.outputs.toolchain-version }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/toolchain
        id: setup

  compliance_job:
    runs-on: ubuntu-24.04
    name: Run compliance checks on patch series (PR)
    needs: setup
    container: ghcr.io/nrfconnect/sdk-nrf-toolchain:${{ needs.setup.outputs.toolchain-version }}
    defaults:
      run:
        shell: bash

    steps:
    - name: Checkout the code
      uses: actions/checkout@v6
      with:
        path: thingy91x-oob
        ref: ${{ github.event.pull_request.head.sha }}
        fetch-depth: 0

    - name: Initialize
      working-directory: thingy91x-oob
      run: |
        apt update
        apt install -y libmagic-dev
        west init -l .
        west config manifest.group-filter +bsec
        west config build.sysbuild True
        west update -o=--depth=1 -n
        west blobs fetch hal_nordic

    - name: Run Compliance Tests
      continue-on-error: true
      id: compliance
      shell: bash
      env:
        BASE_REF: ${{ github.base_ref }}
      working-directory: thingy91x-oob
      run: |
        PYTHON_EXE="$(command -v python3)"
        export PATH="/usr/bin:$PATH"
        unset PERL5LIB PERL5OPT PERLLIB
        export ZEPHYR_BASE="$(realpath ../zephyr)"
        "$PYTHON_EXE" $ZEPHYR_BASE/scripts/ci/check_compliance.py \
          -m Codeowners \
          -m Devicetree \
          -m Gitlint \
          -m Identity \
          -m Nits \
          -m pylint \
          -m checkpatch \
          -m KconfigBasic \
          -c origin/${BASE_REF}..


    - name: check-warns
      working-directory: thingy91x-oob
      shell: bash
      run: |
        if [[ ! -s "compliance.xml" ]]; then
          exit 1;
        fi

    - name: check-warns
      working-directory: thingy91x-oob
      shell: bash
      run: |
        for file in Nits.txt checkpatch.txt Identity.txt Gitlint.txt pylint.txt Devicetree.txt Kconfig.txt KconfigBasic.txt Codeowners.txt; do
          if [[ -s $file ]]; then
             errors=$(cat $file)
             errors="${errors//'%'/'%25'}"
             errors="${errors//$'\n'/'%0A'}"
             errors="${errors//$'\r'/'%0D'}"
             echo "::error file=${file}::$errors"
             exit=1
          fi
        done

        if [[ $exit == 1 ]]; then
          exit 1
        fi
