name: Documentation Publish

permissions:
  contents: read
  pull-requests: write

on:

  workflow_run:
    workflows: ["Documentation Build"]
    types:
      - completed

jobs:
  publish:
    runs-on: ubuntu-24.04
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Download artifacts
        uses: dawidd6/action-download-artifact@bf251b5aa9c2f7eeb574a96ee720e24f801b7c11 # v6
        with:
          workflow: doc-build.yml
          run_id: ${{ github.event.workflow_run.id }}

      - name: Unzip html archive
        working-directory: docs
        run: |
          OUTDIR=$(awk 'NR==1 { if ($3 ~ /^(latest|PR-[0-9]+)$/) print $3 }' monitor_*.txt)
          echo "OUTDIR=$OUTDIR" >> "$GITHUB_ENV"
          unzip legacy-addon-nrfcloud_firmware*.zip -d $OUTDIR
          find "$OUTDIR" -type l -delete

      - name: Obtain PR number
        if: ${{ github.event.workflow_run.event == 'pull_request' }}
        working-directory: docs
        run: |
          if [ -f pr.txt ]; then
            PR=$(head -n 1 pr.txt | tr -cd '0-9')
          fi
          printf 'PR=%s\n' "$PR" >> "$GITHUB_ENV"

      - name: Upload to Azure storage
        working-directory: docs
        env:
          AZCOPY_CONCURRENCY_VALUE: 1024
          NCS_DOC_SAS_PRS: ${{ secrets.NCS_DOC_SAS_PRS }}
          NCS_DOC_SAS_MAIN: ${{ secrets.NCS_DOC_SAS_MAIN }}
        run: |
          if [[ "${{ github.event.workflow_run.event }}" == "pull_request" ]]; then
            azcopy cp $OUTDIR "${{ vars.NCS_DOC_PR_STORAGE_URL }}addons/addon-nrfcloud_firmware?$NCS_DOC_SAS_PRS" --recursive=true
          else
            azcopy cp $OUTDIR "${{ vars.NCS_DOC_STORAGE_URL }}addons/addon-nrfcloud_firmware?$NCS_DOC_SAS_MAIN" --recursive=true
          fi

      - name: Find Comment
        if: ${{ github.event.workflow_run.event == 'pull_request' }}
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4.0.0
        id: fc
        with:
          issue-number: ${{ env.PR }}
          comment-author: 'github-actions[bot]'
          body-includes: documentation preview

      - name: Create or update comment
        if: ${{ github.event.workflow_run.event == 'pull_request' }}
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          comment-id: ${{ steps.fc.outputs.comment-id }}
          issue-number: ${{ env.PR }}
          body: |
            You can find the documentation preview for this PR [here](${{ vars.NCS_DOC_PR_HOSTING_URL }}addons/addon-nrfcloud_firmware/PR-${{ env.PR }}/).
          edit-mode: replace
