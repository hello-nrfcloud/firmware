# Modem trace over UART1.
# Replaces the nrf91-modem-trace-uart snippet, whose devicetree overlay conflicts
# with the custom SRAM layout in boards/thingy91x_nrf9151_ns.overlay. The trace
# shared memory region is already reserved there.

# nRF Modem library trace
CONFIG_NRF_MODEM_LIB_TRACE=y
CONFIG_NRF_MODEM_LIB_TRACE_BACKEND_UART=y

# UART driver
CONFIG_SERIAL=y
CONFIG_UART_ASYNC_API=y
CONFIG_UART_1_ASYNC=y
CONFIG_UART_1_INTERRUPT_DRIVEN=n

# Power management (required by the UART trace backend)
CONFIG_PM_DEVICE=y
